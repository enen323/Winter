spring:
  datasource:
    # useAffectedRows=true 是刻意钉死的，改之前先看 DbRegistrationServiceTest：
    #
    # Connector/J 默认是 false，语义是「匹配到的行数」，于是 INSERT ... ON DUPLICATE KEY UPDATE id=id
    # 命中重复时返回 1 而不是 0，RegistrationMapper.tryConfirm 的去重会静默失效。
    # 实测（mysql-connector-j 8.3.0，用 JDBC 探针分别测三种 URL）：
    #   默认 / useAffectedRows=false → 重复插入返回 1
    #   useAffectedRows=true          → 重复插入返回 0   ← 要的是这个
    # 而 mysql 客户端的 ROW_COUNT() 两种情况都是 0，所以这个坑只在 JDBC 层出现。
    #
    # 隔离级别刻意保持默认 REPEATABLE-READ（D7）：并发死锁不是隔离级别造成的，
    # 实测加 transactionIsolation=READ-COMMITTED 后 UPDATE 仍死锁 129/200 轮。
    url: jdbc:mysql://127.0.0.1:3306/winter?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true&useAffectedRows=true
    username: root
    # 默认值只是为了 IDEA 直接跑得动；真上线前用环境变量 WINTER_DB_PASSWORD 覆盖，
    # 密码不要写死在这个会被提交到 GitHub 的文件里。
    password: ${WINTER_DB_PASSWORD:1234}
    # 压测要的三处：
    #   tomcat.threads.max   默认 200  → 3000 并发下请求堵在 accept 队列，测的是队列不是报名
    #   hikari.maximum-pool-size 默认 10 → 3000 线程抢 10 个连接，connection-timeout(30s) 一到
    #   就抛 SQLTransientConnectionException，那些 500 不是要测的东西
    # 调大只为了让请求真正进到业务代码里，把排队从「Tomcat 队列/连接池」移到「行锁」上。
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
  # schema 由 Flyway 管。注意：MyBatis-Plus 不会像 JPA 的 ddl-auto=validate 那样
  # 启动时比对实体与表结构，列名写错要等运行到那条 SQL 才报错。
  flyway:
    enabled: true
  data:
    redis:
      host: 127.0.0.1
      port: 6379

# L0 起核心就是几条手写 SQL（扣库存、占位、复用行），把 mapper 的 SQL 打开便于观察。
logging:
  level:
    com.winter.reg.mapper: debug

server:
  # 不用默认的 8080：本机跑着 ZooKeeper，它的 AdminServer 默认占 8080
  # （zoo.cfg 没配 admin.serverPort），应用起不来，报 BindException 地址已在使用。
  # ZooKeeper 与本项目无关（RocketMQ 5.x 用自己的 NameServer:9876，不走 ZK），
  # 所以不去动它，应用换个端口。
  port: 8081
  tomcat:
    # 默认 200，3000 并发时多出来的请求排队在 accept-count(默认 100) 里。
    # 调到 4096 是为了让所有请求都进到业务代码，测的是报名链路不是队列。
    threads:
      max: 4096
      min-spare: 64
    # 默认 100；max-threads 满时往里塞的连接数，不够就拒连。
    accept-count: 1000

winter:
  jwt:
    # 同上：默认值是开发用的，上线前必须用 WINTER_JWT_SECRET 覆盖。
    secret: ${WINTER_JWT_SECRET:dev-only-insecure-secret-change-me}
    ttl: PT30M

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,metrics
