spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/winter?serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true
    username: winter
    # 默认值只是为了 IDEA 直接跑得动；真上线前用环境变量 WINTER_DB_PASSWORD 覆盖，
    # 密码不要写死在这个会被提交到 GitHub 的文件里。
    password: ${WINTER_DB_PASSWORD:winter}
  # schema 由 Flyway 管。注意：MyBatis-Plus 不会像 JPA 的 ddl-auto=validate 那样
  # 启动时比对实体与表结构，列名写错要等运行到那条 SQL 才报错。
  flyway:
    enabled: true
  data:
    redis:
      host: 127.0.0.1
      port: 6379

# L0 起核心就是几条手写 SQL（扣库存、占位、复用行），把 mapper 的 SQL 打开便于观察。
logging:
  level:
    com.winter.reg.mapper: debug

server:
  # 不用默认的 8080：本机跑着 ZooKeeper，它的 AdminServer 默认占 8080
  # （zoo.cfg 没配 admin.serverPort），应用起不来，报 BindException 地址已在使用。
  # ZooKeeper 与本项目无关（RocketMQ 5.x 用自己的 NameServer:9876，不走 ZK），
  # 所以不去动它，应用换个端口。
  port: 8081

winter:
  jwt:
    # 同上：默认值是开发用的，上线前必须用 WINTER_JWT_SECRET 覆盖。
    secret: ${WINTER_JWT_SECRET:dev-only-insecure-secret-change-me}
    ttl: PT30M

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,metrics
